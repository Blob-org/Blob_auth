openapi: 3.1.0
info:
  title: auth_service
  version: 1.0.0
  description: |
    Login service for the Blob_storage system. It issues short-lived JWT
    access tokens (EdDSA, 15 min) that blob_service and todos_service verify
    themselves using `GET /.well-known/jwks.json`.

    **Typical flow:** `POST /register` → `POST /login` → copy `accessToken`
    and send it as `Authorization: Bearer <token>` to the other services.
    When it expires, `POST /refresh` returns a new one using the
    `refresh_token` cookie that `/login` set.

    Browsers must call this API with `credentials: "include"` so the cookie
    is sent. `/register` and `/login` are limited to 20 requests per minute
    per IP.
servers:
  - url: http://localhost:4000
    description: Local (bun run dev or docker compose)

paths:
  /register:
    post:
      summary: Create an account
      operationId: register
      security: []
      requestBody:
        $ref: "#/components/requestBodies/Credentials"
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: The email is invalid, or the password isn't 8–256 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                email:
                  value:
                    error: Invalid email
                password:
                  value:
                    error: Password must be 8-256 characters
        "409":
          description: The email is already registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Email already registered
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /login:
    post:
      summary: Log in
      description: |
        Returns an access token and sets the `refresh_token` cookie
        (`HttpOnly`, `SameSite=Strict`, 14 days).

        If the user has MFA on, the password alone isn't enough: the response
        is `{ mfaRequired: true, mfaToken }`, no cookie is set, and the client
        finishes with `POST /login/mfa`.
      operationId: login
      security: []
      requestBody:
        $ref: "#/components/requestBodies/Credentials"
      responses:
        "200":
          description: |
            Logged in (`AccessToken`, cookie set), or the password was right
            and a code is needed next (`MfaChallenge`, no cookie).
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AccessToken"
                  - $ref: "#/components/schemas/MfaChallenge"
        "401":
          description: Wrong email or password. The response doesn't say which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Invalid email or password
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /login/mfa:
    post:
      summary: Finish logging in with a code
      description: |
        The second step for users with MFA on. Send the `mfaToken` from
        `POST /login` and either the 6-digit code from the authenticator app or
        one of the recovery codes (case, spaces and dashes don't matter). Each
        code works once.

        The `mfaToken` lasts 5 minutes, allows 5 wrong codes and signs in once.
        When it can't be used any more the response has `restart: true` and the
        client should go back to the password step.
      operationId: loginMfa
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfaToken, code]
              properties:
                mfaToken:
                  type: string
                code:
                  type: string
                  example: "123456"
      responses:
        "200":
          description: Logged in. The access token's `amr` is `["pwd", "otp"]`.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "401":
          description: |
            Wrong or already used code (try again), or `restart: true` when the
            `mfaToken` is expired, invalid, used up or has had too many wrong
            codes (log in again).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaError"
              examples:
                wrongCode:
                  value:
                    error: Invalid code
                restart:
                  value:
                    error: Your sign-in expired. Sign in again.
                    restart: true
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /mfa/setup:
    post:
      summary: Start setting up MFA
      description: |
        Creates a new TOTP secret for the caller and returns it with an
        `otpauth://` link to show as a QR code. MFA isn't on until
        `POST /mfa/enable` confirms a code. Calling it again replaces an
        unfinished setup.
      operationId: mfaSetup
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Scan `otpauthUrl` (or type `secret`) into an authenticator app.
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauthUrl]
                properties:
                  secret:
                    type: string
                    description: Base32 TOTP secret.
                  otpauthUrl:
                    type: string
                    example: otpauth://totp/Blob%20storage:me%40example.com?issuer=Blob%20storage&secret=JBSWY3DPEHPK3PXP&algorithm=SHA1&digits=6&period=30
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: MFA is already on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /mfa/enable:
    post:
      summary: Turn MFA on
      description: |
        Confirms a code from the app set up with `POST /mfa/setup`, turns MFA
        on and returns 10 recovery codes. They're shown only this once; each
        works once in place of a code.
      operationId: mfaEnable
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  example: "123456"
      responses:
        "200":
          description: MFA is on.
          content:
            application/json:
              schema:
                type: object
                required: [recoveryCodes]
                properties:
                  recoveryCodes:
                    type: array
                    items:
                      type: string
                      example: abcde-fghij
        "400":
          description: "`POST /mfa/setup` wasn't called first."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token, or wrong code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: MFA is already on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /mfa/disable:
    post:
      summary: Turn MFA off
      description: Needs the password and a code (or a recovery code). Deletes the secret and the recovery codes.
      operationId: mfaDisable
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password:
                  type: string
                  format: password
                code:
                  type: string
      responses:
        "204":
          description: MFA is off.
        "400":
          description: MFA isn't on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token, wrong password or wrong code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /refresh:
    post:
      summary: Get a new access token
      description: |
        Exchanges the `refresh_token` cookie for a new access token and a new
        cookie; the old refresh token stops working. Reusing an already
        replaced refresh token logs the user out of every session.
      operationId: refresh
      security:
        - refreshCookie: []
      responses:
        "200":
          description: New access token; the cookie was replaced.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "401":
          description: No cookie, an unknown or reused token, or an expired session. The cookie is cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notLoggedIn:
                  value:
                    error: Not logged in
                expired:
                  value:
                    error: Session expired

  /logout:
    post:
      summary: Log out
      description: Revokes the refresh token in the cookie (if any) and clears the cookie. Always succeeds.
      operationId: logout
      security:
        - refreshCookie: []
        - {}
      responses:
        "204":
          description: Logged out.

  /me:
    get:
      summary: Current user
      operationId: me
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The user the access token belongs to.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/User"
                  - type: object
                    required: [mfaEnabled]
                    properties:
                      mfaEnabled:
                        type: boolean
        "401":
          description: Missing, invalid or expired access token, or the user no longer exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Unauthorized
    delete:
      summary: Delete your account
      description: |
        Permanently deletes the account (GDPR right to erasure). The password is
        checked again, so a stolen access token alone can't do this.

        First every service in `ERASE_URLS` (Blob_storage's `DELETE /files` by
        default) is called with the same access token to erase the user's data.
        If any of them fails, the account is kept and the response is `502`;
        retrying is safe. Then the user and all their sessions are deleted and
        the refresh cookie is cleared.
      operationId: deleteAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
                code:
                  type: string
                  description: Required when MFA is on. A TOTP or recovery code.
      responses:
        "204":
          description: The account and the user's data are gone.
        "401":
          description: Missing or invalid access token, or wrong password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Wrong password
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          description: Another service couldn't erase the user's data. Nothing was deleted from auth_service; try again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Could not erase your data, try again

  /.well-known/jwks.json:
    get:
      summary: Public signing keys
      description: |
        The public half of the token signing key, for other services to
        verify access tokens. Cacheable for 5 minutes.
      operationId: jwks
      security: []
      responses:
        "200":
          description: JSON Web Key Set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jwks"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The `accessToken` from `POST /login` or `POST /refresh`.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Set by `POST /login`. Browsers send it automatically; Swagger UI can't set it by hand.

  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email:
                type: string
                format: email
                maxLength: 254
                description: Trimmed and lower-cased before use.
              password:
                type: string
                minLength: 8
                maxLength: 256
          example:
            email: me@example.com
            password: password123

  headers:
    RefreshCookie:
      description: "`refresh_token=<random>; Path=/; HttpOnly; SameSite=Strict` (+ `Secure` unless COOKIE_SECURE=false)"
      schema:
        type: string

  responses:
    Unauthorized:
      description: Missing, invalid or expired access token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Unauthorized
    TooManyRequests:
      description: More than 20 requests in a minute from this IP.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Too many requests

  schemas:
    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          description: Becomes the `sub` claim of access tokens.
        email:
          type: string
          format: email

    AccessToken:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string
          description: |
            JWT signed with EdDSA. Claims: `sub` (user id), `iss`, `aud`
            (`blob_storage`, `todos_service`), `iat`, `exp` (15 min), and
            `amr`: `["pwd"]`, or `["pwd", "otp"]` when the session was opened
            with a second factor (kept across refreshes).

    MfaChallenge:
      type: object
      required: [mfaRequired, mfaToken]
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          description: Send to `POST /login/mfa` with a code. Valid for 5 minutes; not an access token.

    MfaError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        restart:
          type: boolean
          description: Present and true when the client must log in again.

    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            description: "Ed25519 public JWK (`kty: OKP`, `crv: Ed25519`) with its `kid`."
            additionalProperties: true

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
